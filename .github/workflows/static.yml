# Despliega la web estática (carpeta docs) en GitHub Pages
name: Deploy static content to Pages

on:
  # Se ejecuta en cada push a la rama principal
  push:
    branches: ["main"]

  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

# Permisos del GITHUB_TOKEN necesarios para desplegar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancelan los que están en curso
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Solo la web pública, no la API ni el resto del repo
          path: 'docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
