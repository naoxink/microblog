<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#14171c" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <title>Escribir · naoxink's microblog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #14171c;
      --text: #eceef2;
      --muted: #9aa2af;
      --line: #2c313a;
      --accent: yellowgreen;
      --danger: tomato;
      --measure: 38rem;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 1.1875rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    @media (min-width: 640px) {
      body { font-size: 1.25rem; }
    }

    ::selection {
      background: color-mix(in srgb, var(--accent) 30%, transparent);
    }

    .wrap {
      max-width: var(--measure);
      margin: 0 auto;
      padding:
        calc(clamp(2.5rem, 9vw, 5rem) + env(safe-area-inset-top, 0px))
        1.5rem
        calc(6rem + env(safe-area-inset-bottom, 0px));
    }

    header { margin-bottom: clamp(2.5rem, 7vw, 4rem); }

    h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .hl { color: var(--accent); }

    label {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--muted);
    }

    input,
    textarea {
      display: block;
      width: 100%;
      padding: 0.75rem 0;
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    input:focus,
    textarea:focus { border-bottom-color: var(--accent); }

    textarea {
      min-height: 10rem;
      resize: vertical;
      overflow-wrap: anywhere;
    }

    .field + .field { margin-top: 2rem; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem 1rem;
      margin-top: 1.25rem;
    }

    .count {
      font-size: 0.9375rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .count.over { color: var(--danger); }

    button {
      padding: 0.6rem 1.5rem;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: var(--bg);
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    button:disabled { color: var(--muted); background: transparent; border-color: var(--line); cursor: default; filter: none; }

    .state {
      min-height: 1.6em;
      margin: 1.25rem 0 0;
      font-size: 0.9375rem;
      color: var(--muted);
    }

    .state.ok { color: var(--accent); }
    .state.error { color: var(--danger); }

    .stats { margin-top: 4rem; }
    .stats h2 { margin: 0 0 1rem; font-size: 1.125rem; font-weight: 700; }

    .range { display: flex; gap: 1.25rem; margin-bottom: 1rem; }
    .range button {
      padding: 0.25rem 0;
      font-size: 0.9375rem;
      color: var(--muted);
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
    }
    .range button:hover { filter: none; color: var(--text); }
    .range button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }

    #chart { display: block; width: 100%; height: 220px; touch-action: pan-y; }
    .stats .state { margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><span class="hl">naoxink</span>'s microblog</h1>
    </header>

    <main>
      <form id="form" autocomplete="off" novalidate>
        <div class="field">
          <label for="token">Token</label>
          <!-- Sin name y con autocomplete desactivado para que el navegador no lo guarde -->
          <input id="token" type="password" autocomplete="new-password"
                 autocapitalize="off" autocorrect="off" spellcheck="false" />
        </div>

        <div class="field">
          <label for="content">Publicación</label>
          <textarea id="content" rows="6" autocomplete="off" required></textarea>
        </div>

        <div class="actions">
          <span id="count" class="count">0 / 5000</span>
          <button id="send" type="submit">Enviar</button>
        </div>

        <p id="state" class="state" role="status" aria-live="polite"></p>
      </form>

      <section id="stats" class="stats" hidden aria-labelledby="stats-title">
        <h2 id="stats-title">Publicaciones a lo largo del tiempo</h2>
        <div class="range" role="group" aria-label="Agrupar por">
          <button type="button" data-g="day" aria-pressed="false">Día</button>
          <button type="button" data-g="week" aria-pressed="false">Semana</button>
          <button type="button" data-g="month" aria-pressed="false">Mes</button>
        </div>
        <canvas id="chart" role="img" aria-label="Gráfica de barras con el número de publicaciones por periodo"></canvas>
        <p id="chart-info" class="state" aria-live="polite"></p>
      </section>

    </main>
  </div>

  <script>
    // URL de la función en Vercel (está en otro dominio que esta web)
    const API_URL = 'https://microblog-eosin.vercel.app/api/insert-post'
    const MAX = 5000

    const form = document.getElementById('form')
    const tokenEl = document.getElementById('token')
    const contentEl = document.getElementById('content')
    const sendEl = document.getElementById('send')
    const countEl = document.getElementById('count')
    const stateEl = document.getElementById('state')

    function setState(msg, kind = '') {
      stateEl.textContent = msg
      stateEl.className = 'state' + (kind ? ' ' + kind : '')
    }

    function updateCount() {
      const n = contentEl.value.trim().length
      countEl.textContent = `${n} / ${MAX}`
      countEl.classList.toggle('over', n > MAX)
    }

    contentEl.addEventListener('input', () => {
      updateCount()
      if (stateEl.classList.contains('ok')) setState('')
    })

    // Ctrl/Cmd + Enter para enviar
    contentEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault()
        form.requestSubmit()
      }
    })

    // ---- Gráfica de publicaciones (solo con token válido) ----
    const STATS_URL = 'https://microblog-eosin.vercel.app/api/post-stats'

    const statsEl = document.getElementById('stats')
    const canvas = document.getElementById('chart')
    const infoEl = document.getElementById('chart-info')
    const rangeBtns = document.querySelectorAll('.range button')

    let days = null        // { 'YYYY-MM-DD': n }
    let today = ''
    let gran = null        // 'day' | 'week' | 'month'
    let buckets = []       // [[clave, n], ...]
    let geo = null         // geometría para el hover
    let statsGen = 0       // descarta respuestas obsoletas

    const addDays = (s, n) => {
      const d = new Date(s + 'T00:00:00Z')
      d.setUTCDate(d.getUTCDate() + n)
      return d.toISOString().slice(0, 10)
    }
    const weekStart = (s) => addDays(s, -((new Date(s + 'T00:00:00Z').getUTCDay() + 6) % 7)) // lunes
    const bucketKey = (s) => gran === 'month' ? s.slice(0, 7) : gran === 'week' ? weekStart(s) : s
    const dateOf = (k) => new Date((k.length === 7 ? k + '-01' : k) + 'T00:00:00Z')

    const fmtAxis = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short', year: '2-digit', timeZone: 'UTC' })
    const fmtAxisMonth = new Intl.DateTimeFormat('es-ES', { month: 'short', year: '2-digit', timeZone: 'UTC' })
    const fmtFull = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' })
    const fmtFullMonth = new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric', timeZone: 'UTC' })

    const axisLabel = (k) => (gran === 'month' ? fmtAxisMonth : fmtAxis).format(dateOf(k))
    const fullLabel = (k) =>
      gran === 'month' ? fmtFullMonth.format(dateOf(k))
      : gran === 'week' ? 'Semana del ' + fmtFull.format(dateOf(k))
      : fmtFull.format(dateOf(k))
    const posts = (n) => `${n} ${n === 1 ? 'publicación' : 'publicaciones'}`

    function buildBuckets() {
      const first = Object.keys(days).sort()[0] || today
      const out = new Map()
      // Se recorre día a día para que los periodos vacíos cuenten como 0
      for (let d = first; d <= today; d = addDays(d, 1)) {
        const k = bucketKey(d)
        out.set(k, (out.get(k) || 0) + (days[d] || 0))
      }
      return [...out]
    }

    function niceStep(max) {
      const t = max / 4
      const p = 10 ** Math.floor(Math.log10(t))
      const f = t / p
      return Math.max(1, (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p)
    }

    function summary() {
      const total = buckets.reduce((s, [, n]) => s + n, 0)
      const max = Math.max(...buckets.map(([, n]) => n))
      const unit = gran === 'month' ? 'mes' : gran === 'week' ? 'semana' : 'día'
      infoEl.textContent = `Total: ${posts(total)} · máximo: ${posts(max)} en un ${unit}`
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1
      const w = canvas.clientWidth
      const h = canvas.clientHeight
      if (!w) return
      canvas.width = Math.round(w * dpr)
      canvas.height = Math.round(h * dpr)
      const ctx = canvas.getContext('2d')
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      ctx.clearRect(0, 0, w, h)

      const root = getComputedStyle(document.documentElement)
      const accent = root.getPropertyValue('--accent').trim()
      const muted = root.getPropertyValue('--muted').trim()
      const line = root.getPropertyValue('--line').trim()
      ctx.font = `12px ${getComputedStyle(document.body).fontFamily}`

      const max = Math.max(1, ...buckets.map(([, n]) => n))
      const step = niceStep(max)
      const top = Math.ceil(max / step) * step

      const padL = Math.ceil(ctx.measureText(String(top)).width) + 12
      const padR = 4, padT = 8, padB = 24
      const plotW = w - padL - padR
      const plotH = h - padT - padB
      const yOf = (v) => padT + plotH - (v / top) * plotH

      // Rejilla y eje Y
      ctx.strokeStyle = line
      ctx.fillStyle = muted
      ctx.lineWidth = 1
      ctx.textAlign = 'right'
      ctx.textBaseline = 'middle'
      for (let v = 0; v <= top; v += step) {
        const y = Math.round(yOf(v)) + 0.5
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke()
        ctx.fillText(String(v), padL - 6, y)
      }

      // Barras
      const n = buckets.length
      const slot = plotW / n
      const bw = Math.max(1, slot * 0.7)
      ctx.fillStyle = accent
      buckets.forEach(([, c], i) => {
        if (!c) return
        const x = padL + i * slot + (slot - bw) / 2
        ctx.fillRect(x, yOf(c), bw, yOf(0) - yOf(c))
      })

      // Eje X: primero, medio y último
      ctx.fillStyle = muted
      ctx.textBaseline = 'alphabetic'
      const yText = h - 6
      ctx.textAlign = 'left'
      ctx.fillText(axisLabel(buckets[0][0]), padL, yText)
      if (n > 1) {
        ctx.textAlign = 'right'
        ctx.fillText(axisLabel(buckets[n - 1][0]), w - padR, yText)
      }
      if (n >= 5) {
        ctx.textAlign = 'center'
        ctx.fillText(axisLabel(buckets[Math.floor((n - 1) / 2)][0]), padL + plotW / 2, yText)
      }

      geo = { padL, slot, n }
    }

    function render() {
      rangeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === gran)))
      buckets = buildBuckets()
      draw()
      summary()
    }

    function hideStats() {
      statsGen++
      statsEl.hidden = true
      days = null
    }

    async function loadStats() {
      const token = tokenEl.value.trim()
      if (!token) { hideStats(); return }

      const myGen = ++statsGen
      try {
        const res = await fetch(STATS_URL, { headers: { 'Authorization': `Bearer ${token}` } })
        if (myGen !== statsGen) return

        if (!res.ok) {
          statsEl.hidden = true
          days = null
          if (res.status === 401) setState('Token incorrecto.', 'error')
          else if (res.status === 429) setState('Demasiados intentos con el token.', 'error')
          return
        }

        const data = await res.json()
        if (myGen !== statsGen) return
        days = data.days
        today = data.today
        if (!gran) {
          const first = Object.keys(days).sort()[0] || today
          const span = (new Date(today) - new Date(first)) / 86400000
          gran = span <= 90 ? 'day' : 'week'
        }
        statsEl.hidden = false   // el canvas necesita estar visible para medir su ancho
        render()
      } catch {
        if (myGen === statsGen) statsEl.hidden = true
      }
    }

    rangeBtns.forEach(b => b.addEventListener('click', () => { gran = b.dataset.g; render() }))

    // Hover / toque: muestra el valor de la barra bajo el puntero
    canvas.addEventListener('pointermove', (e) => {
      if (!geo) return
      const x = e.clientX - canvas.getBoundingClientRect().left
      const i = Math.floor((x - geo.padL) / geo.slot)
      if (i < 0 || i >= geo.n) { summary(); return }
      const [k, c] = buckets[i]
      infoEl.textContent = `${fullLabel(k)} · ${posts(c)}`
    })
    canvas.addEventListener('pointerleave', () => { if (days) summary() })

    window.addEventListener('resize', () => { if (!statsEl.hidden && days) draw() })

    // El token cambió: la gráfica se oculta hasta validarlo de nuevo (al salir del campo)
    tokenEl.addEventListener('input', hideStats)
    tokenEl.addEventListener('change', loadStats)

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      if (sendEl.disabled) return

      const token = tokenEl.value.trim()
      const content = contentEl.value.trim()

      if (!token) { setState('Falta el token.', 'error'); tokenEl.focus(); return }
      if (!content) { setState('Escribe algo antes de enviar.', 'error'); contentEl.focus(); return }
      if (content.length > MAX) { setState(`Máximo ${MAX} caracteres.`, 'error'); return }

      sendEl.disabled = true
      setState('Enviando…')

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ content })
        })

        if (res.status === 201) {
          contentEl.value = ''   // el token se queda tal cual
          updateCount()
          setState('Publicado.', 'ok')
          contentEl.focus()
          loadStats()
        } else if (res.status === 401) {
          setState('Token incorrecto.', 'error')
        } else if (res.status === 429) {
          const secs = Number(res.headers.get('Retry-After'))
          setState(secs ? `Demasiados intentos. Reintenta en ${Math.ceil(secs / 60)} min.` : 'Demasiados intentos.', 'error')
        } else {
          let detail = ''
          try { detail = (await res.json()).error || '' } catch {}
          setState(detail || `Error ${res.status}.`, 'error')
        }
      } catch {
        setState('No se pudo conectar con la API.', 'error')
      } finally {
        sendEl.disabled = false
      }
    })
  </script>
</body>
</html>
