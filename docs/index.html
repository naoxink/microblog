<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)" />
  <title>naoxink's microblog</title>
 
  <!-- Atkinson Hyperlegible: tipografía diseñada para máxima legibilidad -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
 
  <style>
    :root {
      --bg: #14171c;
      --text: #eceef2;
      --muted: #9aa2af;
      --line: #2c313a;
      --accent: yellowgreen;
      --danger: tomato;
      --measure: 38rem;
    }
 
    *, *::before, *::after { box-sizing: border-box; }
 
    html { -webkit-text-size-adjust: 100%; }
 
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 1.1875rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
 
    @media (min-width: 640px) {
      body { font-size: 1.25rem; }
    }
 
    ::selection {
      background: color-mix(in srgb, var(--accent) 30%, transparent);
    }
 
    [v-cloak] { display: none; }
 
    .wrap {
      max-width: var(--measure);
      margin: 0 auto;
      padding: clamp(2.5rem, 9vw, 5rem) 1.5rem 6rem;
    }
 
    header { margin-bottom: clamp(2.5rem, 7vw, 4rem); }
 
    h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
 
    .state { margin: 0; color: var(--muted); }
    .state.error { color: var(--danger); }
 
    /* Barra de filtro activo (búsqueda por hashtag) */
    .filter {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.25rem 1rem;
      margin-bottom: 1.25rem;
    }
 
    .filter p { margin: 0; overflow-wrap: anywhere; }
 
    .filter a {
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
    }
 
    .filter a:hover { text-decoration: underline; }
    .filter a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
 
    /* Feed: una fila por post, separadas por líneas finas */
    .timeline {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--line);
    }
 
    .post {
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--line);
    }
 
    .text {
      margin: 0;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
 
    /* Hashtags dentro del texto */
    .tag {
      color: var(--accent);
      text-decoration: none;
    }
 
    .tag:hover { text-decoration: underline; }
    .tag:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
    .tag.active { font-weight: 700; }
 
    .meta {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.9375rem;
      line-height: 1.4;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
 
    .more-btn {
      display: block;
      width: 100%;
      padding: 1.25rem 0;
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--accent);
      background: none;
      border: 0;
      cursor: pointer;
    }
 
    .more-btn:hover { text-decoration: underline; }
    .more-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .more-btn:disabled { color: var(--muted); cursor: default; text-decoration: none; }
 
    .more .state { padding-top: 1.25rem; text-align: center; }
 
    .hl { color: var(--accent); }
 
    .to-top {
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      width: 3rem;
      height: 3rem;
      color: var(--accent);
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 50%;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(0.5rem);
      transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
    }
 
    .to-top.visible {
      opacity: 1;
      visibility: visible;
      transform: none;
    }
 
    .to-top:hover { border-color: var(--muted); }
    .to-top:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
 
    @media (prefers-reduced-motion: reduce) {
      .to-top { transition: none; }
    }
 
    /* Un único fundido al cargar, sin movimiento por elemento */
    @media (prefers-reduced-motion: no-preference) {
      .timeline { animation: fade-in 0.5s ease-out both; }
      @keyframes fade-in { from { opacity: 0; } }
    }
 
    /* Escritorio: botón centrado abajo, alineado con la columna */
    @media (min-width: 640px) {
      .to-top {
        left: 0;
        right: 0;
        margin-inline: auto;
        bottom: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <div class="wrap">
      <header>
        <h1><a :href="baseUrl" style="color: inherit; text-decoration: none" @click.prevent="clearTag"><span class="hl">naoxink</span>'s microblog</a></h1>
      </header>
 
      <main>
        <div v-if="tag" class="filter">
          <p>Publicaciones con <strong class="hl">#{{ tag }}</strong></p>
          <a :href="baseUrl" @click.prevent="clearTag">Ver todos</a>
        </div>
 
        <p v-if="loading" class="state" role="status">Cargando…</p>
        <p v-else-if="error" class="state error" role="alert">{{ error }}</p>
        <p v-else-if="!posts.length" class="state">
          {{ tag ? 'No hay publicaciones con #' + tag + '.' : 'Aún no hay publicaciones.' }}
        </p>
 
        <ol v-else class="timeline">
          <li v-for="post in posts" :key="post.id" class="post">
            <p class="text"><template v-for="(part, i) in post.parts" :key="i"><a v-if="part.tag" class="tag" :class="{ active: part.tag.toLowerCase() === tag }" :href="tagUrl(part.tag)" @click="openTag(part.tag, $event)">{{ part.text }}</a><template v-else>{{ part.text }}</template></template></p>
            <time class="meta" :datetime="post.created_at" :title="fullDate(post.created_at)">
              {{ displayDate(post.created_at) }}
            </time>
          </li>
        </ol>
 
        <div v-if="hasMore || moreError" class="more">
          <p v-if="moreError" class="state error" role="alert">No se pudieron cargar más posts.</p>
          <button type="button" class="more-btn" :disabled="loadingMore" @click="loadMore">
            {{ loadingMore ? 'Cargando…' : moreError ? 'Reintentar' : 'Cargar más' }}
          </button>
        </div>
      </main>
    </div>
    <button type="button" class="to-top" :class="{ visible: showTop }"
            aria-label="Volver arriba" @click="scrollToTop">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7" />
      </svg>
    </button>
  </div>
 
  <!-- Vue 3 (build global) y Supabase (UMD) por CDN -->
  <script src="https://unpkg.com/vue@3.5/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 
  <script>
    // Claves PÚBLICAS: seguras porque RLS solo permite SELECT
    const SUPABASE_URL = 'https://bvcyenlkdutehkgevrhd.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_ZoATFrL7M2UimgxKVPtANg_67VPQq-m'

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
 
    const { createApp, ref, watch, onMounted } = Vue
 
    const rtf = new Intl.RelativeTimeFormat('es', { numeric: 'auto' })
    const fullFmt = new Intl.DateTimeFormat('es-ES', { dateStyle: 'full', timeStyle: 'short' })
 
    // Relativo durante el primer día ("hace 5 minutos"); después, fecha corta
    function displayDate(iso) {
      const d = new Date(iso)
      const diff = Math.min(0, (d - Date.now()) / 1000)
      const abs = Math.abs(diff)
 
      if (abs < 60) return 'Ahora mismo'
      if (abs < 3600) return rtf.format(Math.round(diff / 60), 'minute')
      if (abs < 86400) return rtf.format(Math.round(diff / 3600), 'hour')
 
      const sameYear = d.getFullYear() === new Date().getFullYear()
      return new Intl.DateTimeFormat('es-ES', {
        day: 'numeric',
        month: 'short',
        ...(sameYear ? {} : { year: 'numeric' }),
        hour: '2-digit',
        minute: '2-digit'
      }).format(d)
    }
 
    const fullDate = (iso) => fullFmt.format(new Date(iso))
 
    // ---- Hashtags ----
    // Como en X/Bluesky: letras, números y _, con al menos una letra (#123 no cuenta),
    // y sin carácter de palabra delante (así "a#b" o una URL con #ancla no son hashtags).
    const HASHTAG_RE = /(^|[^\p{L}\p{N}_&\/#])#([\p{L}\p{N}_]*\p{L}[\p{L}\p{N}_]*)/gu
    const TAG_VALID = /^[\p{L}\p{N}_]*\p{L}[\p{L}\p{N}_]*$/u
 
    // Divide el texto en trozos { text } y { text, tag }. Se renderiza sin v-html (sin riesgo de XSS).
    function parseContent(text) {
      const parts = []
      let last = 0
      for (const m of text.matchAll(HASHTAG_RE)) {
        const start = m.index + m[1].length
        if (start > last) parts.push({ text: text.slice(last, start) })
        parts.push({ tag: m[2], text: '#' + m[2] })
        last = start + 1 + m[2].length
      }
      if (last < text.length) parts.push({ text: text.slice(last) })
      return parts
    }
 
    // El hashtag activo vive en la URL (?tag=foo): enlazable y con botón "atrás" funcional
    function readTag() {
      const t = (new URLSearchParams(location.search).get('tag') || '').replace(/^#/, '').toLowerCase()
      // Se valida porque acaba dentro de una expresión regular en la consulta
      return t.length <= 64 && TAG_VALID.test(t) ? t : ''
    }
 
    const baseUrl = location.pathname
    const tagUrl = (t) => `${baseUrl}?tag=${encodeURIComponent(t.toLowerCase())}`
 
    const PAGE_SIZE = 25
 
    createApp({
      setup() {
        const posts = ref([])
        const loading = ref(true)        // carga inicial
        const loadingMore = ref(false)   // cargando una página
        const hasMore = ref(false)
        const error = ref(null)          // error en la carga inicial
        const moreError = ref(false)     // error al cargar más
        const tag = ref(readTag())       // hashtag filtrado ('' = todos)
 
        let gen = 0                      // descarta respuestas de consultas obsoletas
 
        async function loadMore() {
          if (loadingMore.value) return
          const myGen = gen
          loadingMore.value = true
          moreError.value = false
 
          // Pedimos un post extra para saber si quedan más sin hacer otra consulta
          let query = db
            .from('posts')
            .select('id, content, created_at')
            .order('created_at', { ascending: false })
            .limit(PAGE_SIZE + 1)

          // Filtro por hashtag: "#tag" completo, sin distinguir mayúsculas
          // (no coincide con #tagging ni con "a#tag")
          if (tag.value) {
            query = query.filter('content', 'imatch', `(^|[^[:alnum:]_&/#])#${tag.value}([^[:alnum:]_]|$)`)
          }
 
          // Cursor: solo posts más antiguos que el último cargado
          const last = posts.value[posts.value.length - 1]
          if (last) query = query.lt('created_at', last.created_at)
 
          const { data, error: err } = await query
          if (myGen !== gen) return      // mientras tanto se cambió de hashtag
 
          if (err) {
            if (posts.value.length) moreError.value = true
            else error.value = 'No se pudieron cargar los posts. Recarga la página para reintentar.'
          } else {
            hasMore.value = data.length > PAGE_SIZE
            posts.value.push(...data.slice(0, PAGE_SIZE).map(p => ({ ...p, parts: parseContent(p.content) })))
          }
 
          loading.value = false
          loadingMore.value = false
        }
 
        // Vacía el feed y vuelve a cargar desde el principio con el filtro actual
        function reload() {
          gen++
          posts.value = []
          hasMore.value = false
          error.value = null
          moreError.value = false
          loadingMore.value = false
          loading.value = true
          loadMore()
        }
 
        function setTag(t, url) {
          if (t === tag.value) return
          history.pushState(null, '', url)
          tag.value = t
          window.scrollTo(0, 0)
          reload()
        }
 
        function openTag(t, e) {
          // Ctrl/Cmd/Shift/clic central: que el navegador abra el enlace en otra pestaña
          if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return
          e.preventDefault()
          setTag(t.toLowerCase(), tagUrl(t))
        }
 
        function clearTag() { setTag('', baseUrl) }
 
        watch(tag, (t) => {
          document.title = t ? `#${t} · naoxink's microblog` : "naoxink's microblog"
        }, { immediate: true })
 
        const showTop = ref(false)
        const onScroll = () => { showTop.value = window.scrollY > 600 }
 
        onMounted(() => {
          window.addEventListener('scroll', onScroll, { passive: true })
          window.addEventListener('popstate', () => {
            const t = readTag()
            if (t !== tag.value) { tag.value = t; reload() }
          })
          onScroll()
          loadMore()
        })
 
        function scrollToTop() {
          const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' })
        }
 
        return {
          posts, loading, loadingMore, hasMore, error, moreError, loadMore,
          tag, openTag, clearTag, baseUrl, tagUrl,
          showTop, scrollToTop, displayDate, fullDate
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
